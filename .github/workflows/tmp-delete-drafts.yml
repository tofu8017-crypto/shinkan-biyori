name: (一時)ラノベ疑いdraft削除

on:
  workflow_dispatch:

jobs:
  delete:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NEXT_PUBLIC_SUPABASE_URL:  ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm install --omit=dev --no-audit --no-fund
      - run: |
          node scripts/delete-drafts.js \
            kon-yaku-haki-sareta-watashi-mezametara-tonari-ni-koshaku-sama-ga-nete-ita-arasuji \
            migawari-dokufu-arasuji \
            akizakana-osusume-2026-07 \
            kotonoha-osusume-2026-06
