name: はてな自動投稿（被リンク）

# 毎日1本、ナカノ文体の独自記事をはてなブログに公開し、新刊日和へ dofollow 被リンクを張る。
on:
  schedule:
    - cron: "0 23 * * *"   # 毎朝8:00 JST = UTC 23:00（前日）。既存cron(00:30/06:00/07:00)と非衝突。
  workflow_dispatch:
    inputs:
      draft:
        description: "下書きにする場合は yes（テスト用）。既定は公開。"
        required: false
        default: "no"

# posts.log を翌日のために push し戻すため
permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      HATENA_ID:          ${{ secrets.HATENA_ID }}
      HATENA_BLOG_HOST:   ${{ secrets.HATENA_BLOG_HOST }}
      HATENA_API_KEY:     ${{ secrets.HATENA_API_KEY }}
      GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
      DEEPSEEK_API_KEY:   ${{ secrets.DEEPSEEK_API_KEY }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      HATENA_DRAFT:       ${{ github.event.inputs.draft || 'no' }}

    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 自動投稿を実行
        run: bash scripts/hatena-auto-run.sh

      - name: posts.log を保存（翌日の1日1本・重複チェック用）
        run: |
          LOG=".claude/skills/hatena-auto-poster/data/posts.log"
          if [[ -n "$(git status --porcelain "$LOG")" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "$LOG"
            git commit -m "chore(hatena): 投稿記録を更新 [skip ci]"
            git push
          else
            echo "posts.log に変更なし（投稿スキップ日）。"
          fi
