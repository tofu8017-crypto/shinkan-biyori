name: はてな自動投稿（被リンク）

# 毎日1本、ナカノ文体の独自記事をはてなブログに公開し、新刊日和へ dofollow 被リンクを張る。
on:
  schedule:
    - cron: "10 21 * * *"   # 毎朝6:10 JST = UTC 21:10（前日）。7時頃に届くよう早めに発火（GitHub遅延吸収・:00回避）
  workflow_dispatch:
    inputs:
      draft:
        description: "下書きにする場合は yes（テスト用）。既定は公開。"
        required: false
        default: "no"

# posts.log を翌日のために push し戻すため
permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      TZ:                 Asia/Tokyo   # 「1日1本」判定をJST基準に統一（UTCだと8:00JST投稿が前日分と衝突しスキップされる）
      HATENA_ID:          ${{ secrets.HATENA_ID }}
      HATENA_BLOG_HOST:   ${{ secrets.HATENA_BLOG_HOST }}
      HATENA_API_KEY:     ${{ secrets.HATENA_API_KEY }}
      GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
      DEEPSEEK_API_KEY:   ${{ secrets.DEEPSEEK_API_KEY }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      HATENA_DRAFT:       ${{ github.event.inputs.draft || 'no' }}
      GSC_CREDENTIALS_JSON: ${{ secrets.GSC_CREDENTIALS_JSON }}   # テーマプール枯渇時の自動生成用（weekly-optimize.ymlと共用のSecret）

    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 自動投稿を実行
        run: bash scripts/hatena-auto-run.sh

      - name: posts.log とテーマプールを保存（翌日の1日1本・重複チェック・自動生成分の反映用）
        run: |
          LOG=".claude/skills/hatena-auto-poster/data/posts.log"
          THEMES="data/hatena-themes.json"
          if [[ -n "$(git status --porcelain "$LOG" "$THEMES")" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "$LOG" "$THEMES"
            git commit -m "chore(hatena): 投稿記録・テーマプールを更新 [skip ci]"
            git push
          else
            echo "変更なし（投稿スキップ日）。"
          fi
