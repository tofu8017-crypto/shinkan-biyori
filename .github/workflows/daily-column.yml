name: 日次コラム自動執筆（下書き）

on:
  schedule:
    # 毎朝6:00 JST = UTC 21:00（前日）
    - cron: "0 21 * * *"
  # 手動実行ボタン（テスト用）
  workflow_dispatch:

jobs:
  write-columns:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # claude-code-action はOIDCトークン取得に id-token: write が必要
    permissions:
      contents: write
      id-token: write
    # Supabaseキーは既存のGitHub Secretsを再利用（日次バッチと同じもの）
    env:
      NEXT_PUBLIC_SUPABASE_URL:    ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY:   ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: 依存関係インストール
        run: npm install --no-audit --no-fund

      - name: コラムを2本執筆して下書き保存
        uses: anthropics/claude-code-action@v1
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL:    ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY:   ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        with:
          claude_args: "--dangerously-skip-permissions --max-turns 40"
          prompt: |
            新刊日和(shinkanbiyori.com)のコラムを【2本】書いて、Supabaseに【下書き(status:draft)】で保存してください。30分以内に確実に終わらせること。WebSearchは使わない（openBDとDBの情報だけで書く）。公開(publish-column.js)は絶対に実行しない。

            環境変数 NEXT_PUBLIC_SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY は設定済み。スクリプトは `node scripts/xxx.js`（dotenv不要）でそのまま動く。

            文体は `.claude/agents/nakano.md` を1回だけ読んで、その文体・禁止表現に従って自分で書く（サブエージェントは使わない、推敲は1回でよい）。

            手順（テンポよく進める）:
            1. ジャンルを2つ選ぶ（例: エッセイ=001004003 と 海外小説=001004009）。なろう系・ラノベ・POD・ハーレクインは避ける。
            2. 各ジャンルにつき `node scripts/recent-books.js <ジャンルID> 30` を実行し、文芸らしい本を【3冊】選ぶ。isbn13 と amazon_url を控える。
            3. 選んだ計6冊のisbn13をまとめて openBD で1回だけ調べる: `curl -s 'https://api.openbd.jp/v1/get?isbn=<6冊のisbn13をカンマ区切り>'`。内容紹介(TextType=03)を要約に使う。openBDに無い本は、DBのタイトル・著者・出版社・発売日という事実だけで簡潔に紹介する（あらすじの捏造は禁止、WebSearchもしない）。
            4. キーワードは任意。付けるなら recent-books の傾向から自分で決めて良い（suggest-keywordsの実行は省略可）。
            5. 各コラムを `/tmp/column-<slug>.json` に書く。形式: {"slug","title","body_html","excerpt","target_keyword","genre_id","status":"draft"}。slugは半角英数とハイフン+今日の年月(例 essay-2026-06)、body_htmlは1行・h2/p/a/strongなど基本タグのみ・属性はシングルクォート、各本にamazonリンク(<a href='...'>)を本文に貼る。各記事1500〜2500字程度。
            6. すぐに `node scripts/save-column.js /tmp/column-<slug>.json` で保存する。2本とも保存すること。
            7. 最後に2本の「title / slug / 取り上げた本」を箇条書きで報告。

            重要: 1冊ずつ何度も調べ直さない。openBDは1回のまとめ取得で済ませ、早く書いて早く保存する。
