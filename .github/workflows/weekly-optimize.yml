name: 週次SEO自律改善（GSC）

# 毎週月曜6:00 JSTにGSCの検索データを取得し、
#   ① 検索されている作家・書籍を data/gsc-priority.json に反映（コラム生成の優先順位）
#   ② 惜しいページ（11〜30位/低CTR）のtitle/metaをDeepSeekで改善 → seo_overrides
#   ③ docs/optimization-log.md に監査ログを自動追記
# を行う（scripts/weekly-optimize.js）。
# 必要Secrets: GSC_CREDENTIALS_JSON（サービスアカウント鍵JSONの中身）ほか既存のもの。
on:
  schedule:
    - cron: "0 21 * * 0"   # 月曜6:00 JST = 日曜21:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "dry-run（書き込み・コミットなしでログ確認だけ）"
        required: false
        default: "false"

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # gsc-priority.json / optimization-log.md の自動コミット用

    env:
      NEXT_PUBLIC_SUPABASE_URL:  ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DEEPSEEK_API_KEY:          ${{ secrets.DEEPSEEK_API_KEY }}
      GSC_CREDENTIALS_JSON:      ${{ secrets.GSC_CREDENTIALS_JSON }}

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: 依存関係インストール
        run: npm install --omit=dev --no-audit --no-fund

      - name: 自律改善ループを実行
        run: node scripts/weekly-optimize.js ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      - name: 優先度と監査ログをコミット
        run: |
          if [[ -n "$(git status --porcelain data/gsc-priority.json docs/optimization-log.md)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/gsc-priority.json docs/optimization-log.md
            git commit -m "chore(seo): 週次自律改善の結果を反映 [skip ci]"
            git push
          else
            echo "変更なし（dry-run または対象なし）。"
          fi
